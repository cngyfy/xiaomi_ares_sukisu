name: Build Kernel -- ReSukiSU with susfs

on:
  workflow_dispatch:
    inputs:
      enable_feature_kpm:
        description: "是否启用kpm (需要开启susfs)"
        required: false
        default: false
        type: boolean
      SOURCECODE_BRANCH:
        description: '源码分支名称或修订版'
        required: true
        default: 'U-dev'
      SUKISU_BRANCH:
        description: 'ReSukiSU 分支名称或修订版'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 8G
    strategy:
      fail-fast: false
    name: Build Kernel for K40GE
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Package
        run: sudo apt update && sudo apt install -y p7zip-full git ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - uses: actions/checkout@v5

      - name: Get Kernel Source Code
        uses: actions/checkout@v5
        with:
          repository: MerCuJerry/android_kernel_aresin
          ref: ${{ inputs.SOURCECODE_BRANCH }}
          path: kernel
      
      - name: Setup Cross-compile toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-23/llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
          7za x llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
          rm llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
      
      - name: Set up ReSukiSU
        working-directory: kernel
        run: |
          echo DATE=$(date +%F) >> $GITHUB_ENV
          export BRANCH=${{ inputs.SUKISU_BRANCH }}
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s $BRANCH
          cd ./KernelSU
          export KSU_VERSION=$(expr $(/usr/bin/git rev-list --count main) "+" 30000 "+" 700)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

      - name: Get SukiSU Patches
        uses: actions/checkout@v5
        with:
          repository: SukiSU-Ultra/SukiSU_patch
          path: sukisu_patch

      - name: Get susfs patch
        uses: actions/checkout@v5
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          sparse-checkout: Patches/Patch
          ref: mainline
          path: susfs_patch

      # ============ 关键改动 1：强制 patch 失败就停 ============
      - name: Patch Kernel
        working-directory: kernel
        run: |
          set -e
          patch -p1 < $GITHUB_WORKSPACE/Patches/susfs-syscall-hooks.patch
          patch -p1 < $GITHUB_WORKSPACE/Patches/static-symbol-export.patch
          echo "=== 检查是否有 .rej 文件 ==="
          find . -name "*.rej" -print
          if find . -name "*.rej" | grep -q .; then
            echo "ERROR: 有 .rej 文件，patch 没打上"
            exit 1
          fi

      - name: Apply KernelPatch for SUSFS
        working-directory: kernel
        run: |
          set -e
          patch -p1 < $GITHUB_WORKSPACE/susfs_patch/Patches/Patch/susfs_patch_to_4.14.patch || true
          patch -p1 < $GITHUB_WORKSPACE/Patches/susfs_patch_taskmmu.patch
          if [ "${{ inputs.SOURCECODE_BRANCH }}" = "T" ]; then
            patch -p1 < $GITHUB_WORKSPACE/Patches/susfs_patch_base.patch
            patch -p1 < $GITHUB_WORKSPACE/Patches/susfs_patch_fdinfo.patch
            patch -p1 < $GITHUB_WORKSPACE/Patches/susfs_patch_readdir.patch
          elif [ "${{ inputs.SOURCECODE_BRANCH }}" = "U-dev" ]; then
            patch -p1 < $GITHUB_WORKSPACE/Patches/susfs_patch_newuname.patch
          fi

      # ============ 关键改动 2：验证 ksu_handle_newfstat_ret 是否真的在源码里 ============
      - name: Verify newfstat hook
        working-directory: kernel
        run: |
          echo "=== 检查 fs/stat.c 里的 ksu_handle_newfstat_ret ==="
          grep -n "ksu_handle_newfstat_ret" fs/stat.c || echo "!!! fs/stat.c 里没有 ksu_handle_newfstat_ret"
          echo "=== 检查 fs/stat.c 里的 ksu_handle_stat ==="
          grep -n "ksu_handle_stat" fs/stat.c || echo "!!! fs/stat.c 里没有 ksu_handle_stat"
          echo "=== 检查 CONFIG_KSU_MANUAL_HOOK 是否在 defconfig 里 ==="
          grep -n "CONFIG_KSU_MANUAL_HOOK" arch/arm64/configs/ares_user_defconfig || echo "!!! defconfig 里没有 CONFIG_KSU_MANUAL_HOOK"

      - name: Copy defconfig
        run: |
          if [ "${{ inputs.enable_feature_kpm }}" = "true" ]; then
            echo "CONFIG_KALLSYMS_ALL=y" >> $GITHUB_WORKSPACE/Patches/ares_user_defconfig_append
            echo "CONFIG_KPM=y" >> $GITHUB_WORKSPACE/Patches/ares_user_defconfig_append
